<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Bay — open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10131a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #minimap { position: fixed; right: 14px; bottom: 14px; width: 168px; height: 168px;
    border: 2px solid rgba(255,255,255,0.65); border-radius: 8px; background: #20262e; z-index: 5; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #help { position: fixed; left: 14px; bottom: 52px; color: #dfe6ec; font: 12px system-ui, sans-serif;
    background: rgba(8,10,16,0.55); padding: 5px 9px; border-radius: 6px; z-index: 5; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solar Bay: explore a city on foot and by car, complete missions, avoid the police"></canvas>
<canvas id="minimap" width="168" height="168" aria-label="Minimap"></canvas>
<div id="help">WASD move · E car · F punch · Shift run · H horn · Enter talk · P pause · M mute</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./js/main.js"></script>
</body>
</html>
